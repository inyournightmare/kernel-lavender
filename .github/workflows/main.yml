name: Build EAS Kernel with KernelSU Next (Dynamic Support)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncursesw5-dev libglib2.0-dev zip unzip git curl wget

      - name: Clone Toolchain (Proton Clang)
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/clang

      - name: Clone Kernel Source (Southwest Lavender)
        run: |
          git clone --depth=1 https://github.com/pix106/android_kernel_xiaomi_southwest-4.19 -b main kernel_source

      - name: Setup KernelSU Next
        run: |
          cd kernel_source
          # Mengambil langsung repo utama KernelSU-Next dari org resmi
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next drivers/kernelsu
          grep -q "obj-y += kernelsu/" drivers/Makefile || echo "obj-y += kernelsu/" >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

      - name: Patch Defconfig for EAS, KSUN & Dynamic Partitions
        run: |
          cd kernel_source
          DEFCONFIG_FILE="arch/arm64/configs/lavender_defconfig"
          if [ -f "$DEFCONFIG_FILE" ]; then
            # Root KernelSU Next
            echo "CONFIG_KSU=y" >> $DEFCONFIG_FILE
            echo "CONFIG_KSU_TAMPER_SYS_CALLS=y" >> $DEFCONFIG_FILE
            
            # Dukungan Dynamic Partitions (crDroid Android 16)
            echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG_FILE
            echo "CONFIG_EROFS_FS=y" >> $DEFCONFIG_FILE
            echo "CONFIG_EROFS_FS_ZIP=y" >> $DEFCONFIG_FILE
            echo "CONFIG_DM_BOW=y" >> $DEFCONFIG_FILE
            
            # Optimasi EAS
            echo "CONFIG_ENERGY_MODEL=y" >> $DEFCONFIG_FILE
            echo "CONFIG_DEFAULT_USE_ENERGY_AWARE=y" >> $DEFCONFIG_FILE
          fi

      - name: Compile Kernel
        run: |
          cd kernel_source
          export PATH="$(pwd)/../toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make mrproper
          make lavender_defconfig
          make -j$(nproc) O=out

      - name: Package with AnyKernel3 (Lavender Auto-Detect)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          
          if [ -f "kernel_source/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp kernel_source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f "kernel_source/out/arch/arm64/boot/Image.gz" ]; then
            cp kernel_source/out/arch/arm64/boot/Image.gz AnyKernel3/
          fi
          
          cd AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=Southwest-EAS Kernel with KSUN by inyournightmare/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=lavender/' anykernel.sh
          sed -i 's/block=.*/block=auto;/' anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=0;/' anykernel.sh
          
          zip -r9 Southwest-KSUN-Lavender-Dynamic.zip * -x .git README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Southwest-KSUN-Lavender-Dynamic
          path: AnyKernel3/Southwest-KSUN-Lavender-Dynamic.zip
          
