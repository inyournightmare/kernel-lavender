name: Build EAS Kernel with KernelSU Next (Dynamic Support)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fast Install Dependencies
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y bc bison flex libssl-dev libncurses5-dev libncursesw5-dev zip unzip git curl wget

      - name: Clone Toolchain (Azure Clang)
        run: |
          mkdir -p toolchain
          cd toolchain
          git clone --depth=1 https://gitlab.com/panchajanya1999/azure-clang.git clang

      - name: Clone Kernel Source (Lavender EAS)
        run: |
          # Menggunakan repo kernel EAS 4.19 lavender
          git clone --depth=1 https://github.com/PocoF1-Lavender-Builds/android_kernel_xiaomi_lavender -b 4.19 kernel_source || git clone --depth=1 https://github.com/pix106/android_kernel_xiaomi_southwest-4.19 -b main kernel_source

      - name: Setup KernelSU Next (Direct Integration)
        run: |
          cd kernel_source
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next drivers/kernelsu
          grep -q "obj-y += kernelsu/" drivers/Makefile || echo "obj-y += kernelsu/" >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

      - name: Patch Defconfig for EAS, KSUN & Dynamic Partitions
        run: |
          cd kernel_source
          DEFCONFIG_FILE="arch/arm64/configs/lavender_defconfig"
          if [ -f "$DEFCONFIG_FILE" ]; then
            # Root KernelSU Next
            echo "CONFIG_KSU=y" >> $DEFCONFIG_FILE
            echo "CONFIG_KSU_TAMPER_SYS_CALLS=y" >> $DEFCONFIG_FILE
            
            # Dukungan Dynamic Partitions (crDroid Android 16)
            echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG_FILE
            echo "CONFIG_EROFS_FS=y" >> $DEFCONFIG_FILE
            echo "CONFIG_EROFS_FS_ZIP=y" >> $DEFCONFIG_FILE
            echo "CONFIG_DM_BOW=y" >> $DEFCONFIG_FILE
            
            # Optimasi EAS (Energy Aware Scheduling)
            echo "CONFIG_ENERGY_MODEL=y" >> $DEFCONFIG_FILE
            echo "CONFIG_DEFAULT_USE_ENERGY_AWARE=y" >> $DEFCONFIG_FILE
          fi

      - name: Compile Kernel
        run: |
          cd kernel_source
          export PATH="$(pwd)/../toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make mrproper
          make lavender_defconfig
          make -j$(nproc) O=out

      - name: Package with AnyKernel3 (Dynamic Auto-Detect)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          
          if [ -f "kernel_source/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp kernel_source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f "kernel_source/out/arch/arm64/boot/Image.gz" ]; then
            cp kernel_source/out/arch/arm64/boot/Image.gz AnyKernel3/
          fi
          
          cd AnyKernel3
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.1\/by-name\/boot;/block=auto;/' anykernel.sh
          sed -i 's/is_slot_device=1;/is_slot_device=0;/' anykernel.sh
          
          zip -r9 EAS-KSUN-Lavender-Dynamic.zip * -x .git README.md

      - name: Upload Flashable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EAS-KSUN-Lavender-Dynamic
          path: AnyKernel3/EAS-KSUN-Lavender-Dynamic.zip
